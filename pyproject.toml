[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ako4x-rocm"
version = "0.1.0.dev0"
description = "AKO4X for AMD ROCm — agentic kernel optimization on MI300X / MI325X / MI350X / MI355X (gfx942 / gfx950), beating stock HIP, AITER, and FlyDSL."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Andy Luo"},
]
# Upstream authors of AKO4X (NVIDIA branch) credited in README.md and CITATION.
requires-python = ">=3.10"
dependencies = [
    # --- Cross-platform (needed on the orchestrator host for spawn.py / scripts) -----------
    # flashinfer-bench is retained: its TraceSet / Definition / Workload / Solution pydantic
    # models and dataset format are used unchanged; only the *execution engine* is replaced
    # by a ROCm-aware path inside scripts/benchmark_adapter.py.
    "flashinfer-bench @ git+https://github.com/flashinfer-ai/flashinfer-bench.git@main",
    "numpy>=1.24.0",
    "apache-tvm-ffi>=0.1.6,!=0.1.8,!=0.1.8.post0,<0.2",
    "ninja",
    "packaging>=24.2",
    "einops",
    "tabulate",
    "tqdm",
    "click",
    # tomllib is stdlib on 3.11+; tomli is the 3.10 fallback. The orchestrator runs on
    # the user's host (often macOS), so keep host-side TOML parsing unconditional.
    "tomli; python_version < '3.11'",
    # torch has macOS arm64 wheels; keep unconditional so spawn.py imports work everywhere.
    "torch>=2.9.1",

    # --- Linux + ROCm only (the local backend) ---------------------------------------------
    # AITER — AMD's optimized kernel library. The closest "stock expert" analogue to
    # FlashInfer-python on NVIDIA; ako4x-rocm uses it both as a baseline-to-beat AND as a
    # source of pre-tuned reference kernels for the agent to study.
    "aiter @ git+https://github.com/ROCm/aiter.git@main ; sys_platform == 'linux'",
    # Triton wheels are cross-platform; the ROCm backend is bundled when installed on a
    # ROCm host. Pin the same minimum as AKO4X-NV for portability of kernels written in
    # both branches.
    "triton>=3.5.0; sys_platform == 'linux'",
    # rocm-smi-lib provides Python bindings to rocm-smi for GPU detection + telemetry —
    # the analogue of nvidia-ml-py.
    "rocm-smi-lib; sys_platform == 'linux'",
    # CuPy is optional but useful as a reference Python-side ROCm tensor library when the
    # agent wants to prototype outside torch. Comment out to skip; not strictly required.
    # "cupy-rocm-6-3; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Modal does not provide ROCm GPUs as of 2026-05. The ako4x-rocm port uses SLURM / direct
# SSH runners for remote execution (see scripts/run_slurm.py, scripts/run_tensorwave_ssh.py)
# instead of the Modal backend. Kept as an extra in case Modal gains ROCm support; install
# would not enable a runnable backend today.
modal = ["modal>=1.3.0"]

# TileLang has a ROCm backend (install via ROCm wheels or build from source with
# install_rocm.sh). Same name as upstream so the optional-deps surface stays compatible.
tilelang = ["tilelang"]

# FlyDSL is the AMD-internal kernel DSL we target as one of the three baselines.
# Source: github.com/ROCm/FlyDSL (private — contact AMD for access). Listed for
# documentation; manual install required.
# flydsl = ["flydsl @ git+ssh://git@github.com/ROCm/FlyDSL.git@main ; sys_platform == 'linux'"]

# Composable Kernel (CK) — AMD's CUTLASS-equivalent template library.
# Header-only; install via the rocm-composable-kernel package or build from source.
# ck = ["composable-kernel ; sys_platform == 'linux'"]

[tool.hatch.metadata]
allow-direct-references = true
